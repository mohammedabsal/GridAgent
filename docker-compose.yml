version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: gridagent-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=GridAgent-AI
      - GRID_DATA_PROVIDER=SIMULATION
      - CLOUD_RUNTIME_PROVIDER=SIMULATED_K8S
      - DATABASE_URL=sqlite:///./gridagent.db
    volumes:
      - gridagent_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: gridagent-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  gridagent_data:
