services:
  - type: web
    name: gridagent-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: GridAgent-AI
      - key: GRID_DATA_PROVIDER
        value: SIMULATION
      - key: CLOUD_RUNTIME_PROVIDER
        value: SIMULATED_K8S
      - key: DATABASE_URL
        value: sqlite:///./gridagent.db
      - key: ELECTRICITY_MAPS_ZONE
        value: IN-WE

